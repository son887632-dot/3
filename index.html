<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
    overflow: hidden;
    position: relative;
  }

  /* Bong bóng bay */
  .balloon {
    position: absolute;
    bottom: -150px;
    width: 60px;
    height: 75px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: floatUp linear infinite;
    opacity: 0.85;
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -20px;
    left: 50%;
    width: 2px;
    height: 25px;
    background: rgba(255,255,255,0.7);
    transform: translateX(-50%);
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-5deg); }
    50%  { transform: translateY(-55vh) rotate(5deg); }
    100% { transform: translateY(-120vh) rotate(-5deg); }
  }

  /* Thẻ chúc mừng */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    padding: 50px 45px;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    text-align: center;
    max-width: 500px;
    animation: popIn 1s ease-out;
  }
  @keyframes popIn {
    0%   { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    font-size: 2.5rem;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #ff9ff3, #54a0ff);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 4s ease infinite;
    margin-bottom: 15px;
  }
  @keyframes rainbow {
    0%,100% { background-position: 0% 50%; }
    50%     { background-position: 100% 50%; }
  }

  .cake {
    font-size: 5rem;
    display: inline-block;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%     { transform: translateY(-15px) rotate(3deg); }
  }

  .message {
    font-size: 1.15rem;
    color: #555;
    line-height: 1.7;
    margin: 20px 0;
  }
  .name {
    font-weight: 700;
    color: #e84393;
    font-size: 1.4rem;
  }

  .btn {
    margin-top: 10px;
    padding: 14px 35px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #ff6b6b, #feca57);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,107,107,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 25px rgba(255,107,107,0.6);
  }
  .btn:active { transform: scale(0.97); }

  /* Confetti */
  .confetti {
    position: fixed;
    top: -10px;
    width: 10px;
    height: 10px;
    opacity: 0;
    z-index: 20;
    pointer-events: none;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

  <!-- Bong bóng sẽ được tạo bằng JS -->

  <div class="card">
    <div class="cake">🎂</div>
    <h1>Happy Birthday!</h1>
    <p class="message">
      Chúc mừng sinh nhật <span class="name" id="name">Bạn</span>! 🎉<br>
      Chúc bạn một tuổi mới tràn đầy niềm vui,<br>
      hạnh phúc và thành công. 💖
    </p>
    <button class="btn" onclick="celebrate()">🎁 Bấm để nhận quà</button>
  </div>

<script>
  // Tạo bong bóng bay
  const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#1dd1a1','#54a0ff','#f368e0'];
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.classList.add('balloon');
    const size = 40 + Math.random() * 50;
    b.style.width = size + 'px';
    b.style.height = size * 1.25 + 'px';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.background = colors[Math.floor(Math.random() * colors.length)];
    b.style.animationDuration = (8 + Math.random() * 8) + 's';
    b.style.animationDelay = (Math.random() * 8) + 's';
    document.body.appendChild(b);
  }

  // Hiệu ứng confetti
  function celebrate() {
    const n = 80;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.classList.add('confetti');
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      c.style.width = (6 + Math.random() * 8) + 'px';
      c.style.height = c.style.width;
      c.style.animation = `fall ${2 + Math.random() * 2}s linear forwards`;
      c.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
    document.getElementById('name').textContent = 'bạn yêu quý';
  }
</script>
</body>
</html>
